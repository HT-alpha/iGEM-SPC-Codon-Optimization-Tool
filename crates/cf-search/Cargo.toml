[package]
name = "cf-search"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Three-tier search engine: genotype, variation operators, and the population loop."

[dependencies]
cf-types = { path = "../cf-types" }
# The seam, never a predictor. cf-search does not depend on cf-landscape or on
# any predictor crate; the epistatic conditional arrives through ContextModel.
cf-landscape-api = { path = "../cf-landscape-api" }
cf-constraints = { path = "../cf-constraints" }
cf-metrics = { path = "../cf-metrics" }
serde_json = { workspace = true }
rayon = "1.10"
