signed_off_by:   NG Chi Hong
role:            Biology Teacher
institution:     St. Paul's College
date:            2026-10-05
amendment:       AMD-013
scope: |
  I confirm that I have reviewed AMD-013, the licence and patent analysis
  for the CodonForge iGEM codon optimization project. Specifically, I
  reviewed the following:

  ViennaRNA and LinearFold are used as user-installed dependencies only,
  and are not bundled with the software. Their licence terms permit this
  use for a non-commercial, freely distributed project.

  LinearDesign (Baidu Research) is covered by an active patent. The
  CodonForge code does not implement the patented method (CFG × DFA
  intersection for joint MFE and codon optimization). A software test
  enforces this.

  I accept this analysis for the purposes of a non-commercial iGEM
  educational project. I understand this is not a formal legal opinion,
  and that wider commercial distribution would require a separate legal
  review.
conditions:      none
evidence:        email from NG Chi Hong to Kwok Cho TSANG, 2026-10-05
primerforge_scope_note: >
  This sign-off predates the addition of PrimerForge to the DNA
  Design Suite (added after 2026-10-05). PrimerForge was reviewed
  by the engineering team as not changing the scope of AMD-013: it
  does not use ViennaRNA, LinearFold, or LinearDesign's claimed
  method, and it does not vendor any licensed tool. The signed
  statements in this file remain accurate for the full DNA Design
  Suite as of v2.0.0.
