# Template for docs/legal-clearance.yaml — copy, fill in, commit.
#
# AMD-013 cleared ViennaRNA and LinearFold from their primary licence texts and
# concluded that DNA Design Suite does not practise LinearDesign's claimed method.
# The licence reading is plain. The patent conclusion is an engineer's reading
# of claim text, made without confirming grant status, and it needs a human with
# actual authority to sign off before a release ships.
#
# tools/check_release_clearance.py enforces this in the release workflow.

# Who reviewed it.
signed_off_by: "Dr. Example Name"

# Faculty advisor, PI, or institutional technology-transfer / legal contact.
role: "faculty advisor"

# YYYY-MM-DD. Expires after a year: patent status changes.
date: "2026-01-01"

# The analysis reviewed. This gate covers AMD-013 specifically.
amendment: "AMD-013"

# What was actually reviewed, in the reviewer's words. Not a checkbox — if this
# says less than the three items below, the review did not cover the gate.
scope: |
  Reviewed AMD-013 in full, specifically:
    - ViennaRNA and LinearFold licence terms against a free, non-commercial
      distribution, including the attribution obligations in NOTICE;
    - the LinearDesign claim-scope analysis (US 2022/0269951 A1,
      EP 4 030 438 A1) and the conclusion that DNA Design Suite's architecture does
      not practise the claimed CFG-over-DFA method;
    - the fact that grant status was not confirmed and that claim scope outside
      the US and EP was not examined.

# Anything the reviewer wants recorded — conditions, caveats, follow-ups.
notes: |
  Optional.
