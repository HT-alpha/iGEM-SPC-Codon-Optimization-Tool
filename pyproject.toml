[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "dna-design-suite"
version = "0.1.0"
description = "DNA Design Suite: a codon optimization tool and a primer design tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "biopython>=1.83",
  "jsonschema>=4.18",
  "pyyaml>=6",
]

# Dependency policy (AMD-013, superseding AMD-009's stricter reading).
#
# The runtime dependencies above must stay redistributable under Apache-2.0.
# There is still deliberately NO extra that installs a structure engine, and the
# reason has changed: it is no longer that ViennaRNA's licence forbids it - it
# does not, for a free distribution - but that a runtime dependency declared
# here is one DNA Design Suite's own wheel asserts a relationship with. Detection at
# runtime keeps the wheel's dependency set entirely Apache-2.0 and keeps the
# user, not DNA Design Suite, the party who installed ViennaRNA.
#
# LinearDesign's method stays excluded on patent grounds regardless (AMD-013).
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "maturin>=1.5,<2",
  "ruff>=0.5",
]
# Test-only. Installed in CI so the structure-engine reference checks actually
# run: a suite where TST-STRU-001 silently skips proves nothing about the
# binding, which is why CF_REQUIRE_STRUCTURE_ENGINE turns those skips into
# failures. Not a runtime dependency and not shipped.
structure-tests = [
  "ViennaRNA>=2.6",
]
# Optional SBOL 3 export (`DEP-SBOL-001`). pySBOL3 (`sbol3`) is MIT-licensed.
# It is not imported unless a caller asks for SBOL, and a missing install is
# `CF-SBOL-001`. The default install does not depend on it.
sbol = [
  "sbol3>=1.2,<2",
]

[project.scripts]
dna-design-suite = "dna_design_suite.cli.main:main"

[tool.maturin]
manifest-path = "crates/cf-pyext/Cargo.toml"
module-name = "dna_design_suite._core"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
