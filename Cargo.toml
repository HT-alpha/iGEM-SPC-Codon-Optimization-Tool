[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
repository = "https://github.com/HT-alpha/iGEM-Codon-Optimization-Tool"

# Dependency policy (see planning/00-scope/03-architecture-amendments.md AMD-009
# and RISK-DEP-001/002): every dependency must be redistributable under
# Apache-2.0. ViennaRNA, LinearFold and LinearDesign are excluded from the
# dependency tree entirely - not as an optional feature, not behind a flag.
# Structure prediction goes through the StructureEngine seam against the
# permissive native kernel.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is not optional here. Without it serde_json parses floats
# through a fast path that can land one ulp away from the value that was
# written, so a document carrying an f64 does not survive a write-read cycle.
# Every checkpoint in this system carries floats — objective vectors,
# hypervolume history, constraint violations — so a resumed run would diverge
# from an uninterrupted one by a rounding error, which is precisely what
# GATE-REPRO-001 forbids. Found when a tier-3 resume diverged and the diff came
# down to 0.40476190476190477 becoming 0.4047619047619048.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# The search engine is unusable at `dev` optimization levels, and the
# property tests in cf-types/cf-constraints run 10^4-10^6 iterations.
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
