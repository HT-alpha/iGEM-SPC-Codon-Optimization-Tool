name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A pull_request run sets head_ref to the source branch. A push run
  # leaves head_ref empty and sets ref_name to the branch. The same
  # branch therefore shares one group, and cancel-in-progress drops the
  # older of a push and a pull_request that both started for that branch.
  # Push is limited to main, so a feature branch is not built twice in
  # the common case; this group is what collapses the two when they do.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Rust is 1.98.1 in rust-toolchain.toml and in every `toolchain:` input below.
# `@stable` on the action's `uses:` line is the action's version, not the
# compiler. Passing `toolchain: stable` is how a local 1.83 install stayed
# green while CI's newer clippy failed. Keep the two pins the same.
#
# RISK-LAT-005: checkout@v5 and setup-python@v6 run on Node 24. upload and
# download of wheels use the Node 24 majors as well. Do not pin these back
# to a Node 20 action to silence a warning.

jobs:
  # Docs-only and benchmark-doc diffs skip every job that needs this
  # output. An empty or unreadable diff sets heavy=true, so a filter
  # failure cannot go green by skipping the tests. The classifier is
  # tools/ci_path_filter.py.
  changes:
    name: classify diff
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        name: classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$FORCED" = "true" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "force-push; running the heavy gate" >&2
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "no base commit; running the heavy gate" >&2
            exit 0
          fi
          if ! printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "base is not a sha; running the heavy gate" >&2
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "base commit unavailable; running the heavy gate" >&2
            exit 0
          fi
          tmp="$(mktemp)"
          if ! git diff --name-only --no-renames "$BASE_SHA" HEAD > "$tmp"; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "git diff failed; running the heavy gate" >&2
            exit 0
          fi
          echo "paths:" >&2
          sed 's/^/  /' "$tmp" >&2
          python3 tools/ci_path_filter.py "$tmp" >> "$GITHUB_OUTPUT"

  # Repository invariants first: they are seconds-fast, and a layering or
  # schema-sync failure makes every other job's result uninteresting.
  # They stay on for a docs-only diff. The heavy jobs below do not.
  invariants:
    name: repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install jsonschema pyyaml
      - name: planning package
        run: python planning/tools/validate_planning_package.py
      - name: module layering and the pyo3 boundary
        run: python tools/check_module_layering.py --check
      - name: schema sync and drift
        run: python tools/check_schema_sync.py --check

  fmt-and-lint:
    name: fmt + clippy + ruff
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pip install ruff
      - run: ruff check python tools planning/tools
      - run: ruff format --check python tools planning/tools

  # One isolated slice per crate, so a PR touching one crate gets a signal that
  # is actually about that crate (planning/01-modules/01-repository-layout.md
  # section 4: "independently testable").
  rust-crate:
    name: cargo test -p ${{ matrix.crate }}
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - cf-types
          - cf-metrics
          - cf-landscape-api
          - cf-constraints
          - cf-epistasis
          - cf-burden
          - cf-biophys-structure
          - cf-biophys-kinetics
          - cf-landscape
          - cf-search
          - cf-primer-thermo
          - cf-primer-search
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.crate }}
      - run: cargo test -p ${{ matrix.crate }} --all-targets

  # cf-pyext has no Rust test harness by design (see its Cargo.toml): its
  # surface is exercised from Python by the `python` job below. Building it is
  # still worth a job of its own, because a break here breaks every wheel.
  pyext-builds:
    name: cargo build -p cf-pyext
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cf-pyext --all-targets

  python:
    name: pytest (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: Swatinem/rust-cache@v2
      # ViennaRNA is a test-only install here, never a shipped dependency
      # (AMD-013). Without it the structure-engine reference checks would skip
      # and the suite would be green without testing the binding at all.
      #
      # `maturin develop` needs a virtualenv (`.venv` or `VIRTUAL_ENV`). A
      # `pip install maturin && maturin develop` against setup-python's prefix
      # therefore dies before pytest runs. Create the env with `virtualenv`,
      # the same tool `make setup` prefers, rather than a bare stdlib venv
      # (that module needs `ensurepip` / `python3-venv`, which is not always
      # installable).
      - name: virtualenv and Python test dependencies
        run: |
          python -m pip install -q virtualenv
          python -m virtualenv .venv
          .venv/bin/pip install -q maturin pytest jsonschema pyyaml biopython ViennaRNA
      - name: build the core into the environment
        run: .venv/bin/maturin develop
      - run: .venv/bin/pytest -q
        env:
          # Turns a skipped structure-engine check into a failure, so CI cannot
          # go green by not running the checks that matter most.
          CF_REQUIRE_STRUCTURE_ENGINE: "1"
          # The helix geometry and state-machine tests run helix.js under Node,
          # which GitHub's runners ship. Turns a missing Node into a failure.
          CF_REQUIRE_NODE: "1"

  # The vendored NCBI tables are generated, not hand-written. If regenerating
  # them changes the file, either upstream changed or somebody edited the
  # generated asset by hand; both need a human.
  generated-assets:
    name: generated assets are reproducible
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install biopython
      - run: python tools/generate_genetic_codes.py
      - name: fail if the regenerated tables differ
        run: git diff --exit-code -- crates/cf-types/data/genetic_codes.json
