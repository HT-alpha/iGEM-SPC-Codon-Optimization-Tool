name: wheels

# Phase 1 exit criterion: "Wheels build on all three platforms with no Rust
# toolchain required at install time." abi3-py311 means one wheel per platform
# serves every supported CPython, so the matrix stays small.

on:
  push:
    # Stable tags only. A pre-release such as v0.1.0-igem documents an iGEM
    # snapshot and must not start legal-clearance: that job blocks every
    # build it is a `needs` of, and the sign-off file is still absent.
    # The hyphen is the pre-release mark. v1.2.3 still enters the gate.
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # Weekly, so a platform breakage is found before a release rather than
    # during one.
    - cron: "0 4 * * 1"

jobs:
  # AMD-013. A release that ships structure-kernel functionality needs a human
  # with actual authority to have reviewed the licence and patent position
  # first. This job runs before anything is built, and blocks the release when
  # no sign-off is on file - which is the state today, deliberately.
  #
  # It is first in the file and a `needs:` of every other job because a gate
  # that runs alongside the build is a gate that gets ignored when the build
  # succeeds.
  legal-clearance:
    name: legal clearance (AMD-013)
    # Pre-release tags contain a hyphen (v0.1.0-igem). They push, and they
    # skip this job, so the wheel build that `needs` it is skipped too.
    # schedule and workflow_dispatch are not tag pushes and still run the gate.
    if: github.event_name != 'push' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: require sign-off before a structure-kernel release
        run: python tools/check_release_clearance.py

  build:
    name: ${{ matrix.platform.os }} ${{ matrix.platform.target }}
    needs: legal-clearance
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  verify-no-toolchain-needed:
    name: install the wheel without a Rust toolchain
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest-x86_64
          path: dist
      # Deliberately no rust-toolchain step: the point of this job is that a
      # user installing a released wheel never needs cargo.
      - run: pip install dist/*.whl
      - run: |
          python -c "
          import codonforge
          assert codonforge.core_available(), 'wheel did not ship the compiled core'
          print('core', codonforge.core_version())
          "
