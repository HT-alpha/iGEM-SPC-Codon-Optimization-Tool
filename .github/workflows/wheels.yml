name: wheels

# Phase 1 exit criterion: "Wheels build on all three platforms with no Rust
# toolchain required at install time." abi3-py311 means one wheel per platform
# serves every supported CPython (3.11 through 3.13). CPython 3.9 and 3.10
# are outside requires-python.
#
# This workflow uploads artifacts. It does not publish to PyPI and it must
# not gain a PyPI token. Hugo publishes by downloading the artifacts and
# running twine himself. The steps are in the README.
#
# It does not run on a branch push, and it has no schedule. A manual run
# builds Linux x86_64 unless the target input is `all`. A version tag
# without a hyphen (`v0.1.0`) builds every platform. A hyphenated tag
# (`v0.1.0-igem`) matches the tag filter, then skips legal-clearance, and
# the builds that need it are skipped too. A GitHub Release is not a
# trigger: publishing a release from a newly pushed tag would otherwise
# build the matrix twice. Dispatch the workflow if the tag is already on
# the commit.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "linux-x86_64 (default) or all platforms before a publish"
        type: choice
        default: linux-x86_64
        options:
          - linux-x86_64
          - all
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # AMD-013. A release that ships structure-kernel functionality needs a human
  # with actual authority to have reviewed the licence and patent position
  # first. This job runs before anything is built, and blocks the release when
  # no sign-off is on file.
  #
  # It is first in the file and a `needs:` of every other job because a gate
  # that runs alongside the build is a gate that gets ignored when the build
  # succeeds.
  #
  # Pre-release *tags* contain a hyphen (v0.1.0-igem). They skip this job,
  # so the wheel build that `needs` it is skipped too. A hyphen in a branch
  # name is not that mark. A manual run on a branch still enters the gate
  # and, when it passes, uploads the wheels selected for that run.
  legal-clearance:
    name: legal clearance (AMD-013)
    if: github.ref_type != 'tag' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.json }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install pyyaml
      - name: require sign-off before a structure-kernel release
        run: python tools/check_release_clearance.py
      - name: select wheel platforms
        id: platforms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          json="$(python tools/wheel_targets.py --event-name "$EVENT_NAME" --targets "$TARGETS")"
          echo "json=${json}" >> "$GITHUB_OUTPUT"
          echo "platforms ${json}"

  build:
    name: ${{ matrix.platform.os }} ${{ matrix.platform.target }}
    needs: legal-clearance
    if: needs.legal-clearance.result == 'success' && needs.legal-clearance.outputs.platforms != ''
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.legal-clearance.outputs.platforms || '[]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The page serves demo files from dna_design_suite/api/examples. A checkout
      # does not have that copy until this script writes it.
      - run: python tools/stage_wheel_examples.py
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: "true"
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: source distribution
    needs: legal-clearance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "maturin>=1.5,<2"
      - run: python tools/stage_wheel_examples.py
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist

  verify-no-toolchain-needed:
    name: install the wheel without a Rust toolchain
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@v7
        with:
          name: wheel-ubuntu-latest-x86_64
          path: dist
      # Deliberately no rust-toolchain step: the point of this job is that a
      # user installing a released wheel never needs cargo.
      - run: pip install dist/*.whl
      - run: |
          python -c "
          import dna_design_suite
          assert dna_design_suite.core_available(), 'wheel did not ship the compiled core'
          print('core', dna_design_suite.core_version())
          "
