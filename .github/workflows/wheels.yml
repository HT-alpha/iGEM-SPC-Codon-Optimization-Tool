name: wheels

# Phase 1 exit criterion: "Wheels build on all three platforms with no Rust
# toolchain required at install time." abi3-py311 means one wheel per platform
# serves every supported CPython (3.11 through 3.13). CPython 3.9 and 3.10
# are outside requires-python.
#
# This workflow uploads artifacts. It does not publish. Publishing is
# `.github/workflows/publish.yml`, which uses GitHub Trusted Publishing.
# This file must not gain a PyPI token, and its `on:` must not list tags:
# a branch filter is what keeps a tag push from starting a build.

on:
  push:
    # Every branch. A branch filter is what keeps a tag push from starting this workflow.
    branches: ["**"]
  workflow_dispatch:
  schedule:
    # Weekly, so a platform breakage is found before a release rather than
    # during one.
    - cron: "0 4 * * 1"

jobs:
  # AMD-013. A release that ships structure-kernel functionality needs a human
  # with actual authority to have reviewed the licence and patent position
  # first. This job runs before anything is built, and blocks the release when
  # no sign-off is on file.
  #
  # It is first in the file and a `needs:` of every other job because a gate
  # that runs alongside the build is a gate that gets ignored when the build
  # succeeds.
  legal-clearance:
    name: legal clearance (AMD-013)
    # Pre-release *tags* contain a hyphen (v0.1.0-igem). They skip this job,
    # so the wheel build that `needs` it is skipped too. A hyphen in a branch
    # name is not that mark: branch pushes still enter the gate and, when it
    # passes, upload wheels.
    if: github.ref_type != 'tag' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: require sign-off before a structure-kernel release
        run: python tools/check_release_clearance.py

  build:
    name: ${{ matrix.platform.os }} ${{ matrix.platform.target }}
    needs: legal-clearance
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The page serves demo files from dna_design_suite/api/examples. A checkout
      # does not have that copy until this script writes it.
      - run: python tools/stage_wheel_examples.py
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: source distribution
    needs: legal-clearance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "maturin>=1.5,<2"
      - run: python tools/stage_wheel_examples.py
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist

  verify-no-toolchain-needed:
    name: install the wheel without a Rust toolchain
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: wheel-ubuntu-latest-x86_64
          path: dist
      # Deliberately no rust-toolchain step: the point of this job is that a
      # user installing a released wheel never needs cargo.
      - run: pip install dist/*.whl
      - run: |
          python -c "
          import dna_design_suite
          assert dna_design_suite.core_available(), 'wheel did not ship the compiled core'
          print('core', dna_design_suite.core_version())
          "
